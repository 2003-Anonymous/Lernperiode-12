
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines | Casino Royal</title>
    <link rel="stylesheet" href="mines.css">
</head>
<body>

    <header class="topbar">
        <a href="A.index.html" class="back-button">← Zur Homepage</a>
        <div class="brand">CASINO ROYAL</div>
        <div class="game-name">MINES</div>
    </header>

    <main class="container">

        <div class="game-title">
            <h1>MINES</h1>
            <p>Finde die Diamanten und vermeide die Bomben!</p>
        </div>

        <section class="game-container">

            <div class="game-settings">
                <h2>Spieleinstellungen</h2>

                <div class="setting">
                    <label>Einsatz</label>
                    <div class="setting-value">10 CHF</div>
                </div>

                <div class="setting">
                    <label>Anzahl Bomben</label>
                    <div class="setting-value">3 Bomben</div>
                </div>

                <div class="setting">
                    <label>Multiplikator</label>
                    <div class="setting-value">1.00×</div>
                </div>

                <button class="start-button" disabled>
                    SPIEL STARTEN
                </button>
            </div>

            <div class="game-area">
                <h2>Spielfeld</h2>

                <div class="game-board">
                    <p>Hier entsteht das Mines-Spielfeld.</p>
                </div>

                <p class="game-hint">
                    Decke Diamanten auf und sichere deinen Gewinn.
                </p>
            </div>

        </section>

    </main>

</body>
</html>
