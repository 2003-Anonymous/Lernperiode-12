name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Wegwerf-Datenbank nur für diesen Lauf
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test_Passw0rd!
        ports: [ "1433:1433" ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test_Passw0rd! -C -Q 'SELECT 1'"
          --health-interval 10s --health-retries 10

    env:
      TEST_DB_CONNECTION: Server=localhost,1433;Database=Casino_Test;User Id=sa;Password=Test_Passw0rd!;TrustServerCertificate=True

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Abhängigkeiten laden
        run: dotnet restore LP-12_API.slnx

      - name: Formatierung prüfen
        run: dotnet format LP-12_API.slnx --verify-no-changes --no-restore

      - name: Bauen
        run: dotnet build LP-12_API.slnx --no-restore -c Release

      - name: Unit- und Integrationstests
        run: dotnet test LP-12_API.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Coverage-Bericht erstellen
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub

      - name: Coverage in der Zusammenfassung anzeigen
        if: always()
        run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY