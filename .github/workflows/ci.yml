name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test_Passw0rd!
        ports: [ "1433:1433" ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test_Passw0rd! -C -Q 'SELECT 1'"
          --health-interval 10s --health-retries 10

    env:
      TEST_DB_CONNECTION: Server=localhost,1433;Database=Casino_Test;User Id=sa;Password=Test_Passw0rd!;TrustServerCertificate=True

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Abhängigkeiten laden
        run: dotnet restore LP-12_API.slnx

      - name: Formatierung prüfen
        run: dotnet format LP-12_API.slnx --verify-no-changes --no-restore

      - name: Bauen
        run: dotnet build LP-12_API.slnx --no-restore -c Release

      - name: Unit- und Integrationstests
        run: dotnet test LP-12_API.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Coverage-Bericht erstellen
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub

      - name: Coverage in der Zusammenfassung anzeigen
        if: always()
        run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: HTML prüfen
        run: npm run lint:html

      - name: CSS prüfen
        run: npm run lint:css

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test_Passw0rd!
        ports: [ "1433:1433" ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test_Passw0rd! -C -Q 'SELECT 1'"
          --health-interval 10s --health-retries 10

    env:
      ConnectionStrings__CasinoContext: "Server=localhost,1433;Database=Casino_Playwright;User Id=sa;Password=Test_Passw0rd!;TrustServerCertificate=True"
      ASPNETCORE_URLS: http://localhost:5241

    steps:
      - uses: actions/checkout@v4

      - name: .NET installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: .NET-Abhängigkeiten laden
        run: dotnet restore LP-12_API.slnx

      - name: API bauen
        run: dotnet build LP-12_API.slnx --no-restore -c Release

      - name: EF-Core-Werkzeug installieren
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Testdatenbank migrieren
        run: "$HOME/.dotnet/tools/dotnet-ef" database update --project LP-12_API/LP-12_API.csproj --startup-project LP-12_API/LP-12_API.csproj

      - name: Playwright-Abhängigkeiten laden
        working-directory: e2e
        run: npm ci

      - name: Chromium installieren
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: API starten
        run: |
          dotnet run --no-build --configuration Release --project LP-12_API/LP-12_API.csproj > /tmp/casino-api.log 2>&1 &

      - name: Warten, bis die API bereit ist
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:5241/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/casino-api.log
          exit 1

      - name: Playwright-Browsertests ausführen
        working-directory: e2e
        run: npx playwright test --project=chromium

      - name: Playwright-Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14