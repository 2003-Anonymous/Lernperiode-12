<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubbellose | Casino Royal</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="rubbellos.css?v=2">
    <script src="assets/balance.js?v=2" defer></script>
    <script src="rubbellos.js?v=3" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="back-link" href="home.html">← Homepage</a>

            <a class="brand" href="home.html">
                <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M24 5 43 24 24 43 5 24Z" />
                    <path d="m24 14 10 10-10 10-10-10Z" />
                </svg>
                <span>Casino Royal</span>
            </a>

            <div class="balance">
                <span class="balance-label">Guthaben</span>
                <span><span id="balance">…</span> CHF</span>
            </div>
        </div>
    </header>

    <main>
        <section id="shop" aria-labelledby="shop-title">
            <div class="intro">
                <p class="eyebrow">Rubbellose</p>
                <h1 id="shop-title">Wähle dein Los.</h1>
                <p class="intro-text">Kaufen, freirubbeln und sofort sehen, ob du gewonnen hast.</p>
            </div>

            <div id="ticket-list" class="ticket-list"></div>
            <p id="shop-message" class="message" role="status"></p>
        </section>

        <section id="game" hidden aria-labelledby="ticket-title">
            <div class="game-head">
                <div>
                    <p class="eyebrow">Dein Los</p>
                    <h1 id="ticket-title">Los</h1>
                </div>
                <button id="back-to-shop" class="btn btn-ghost" type="button">← Zurück zum Shop</button>
            </div>

            <div class="game-layout">
                <div class="ticket">
                    <div class="ticket-top">
                        <span id="ticket-name-small">Casino Royal</span>
                        <span id="progress">Aufgedeckt: 0 / 0</span>
                    </div>
                    <div id="grid" class="grid"></div>
                    <p id="current-win" class="current-win"></p>
                </div>

                <aside class="sidebar">
                    <label class="toggle">
                        <input id="scratch-mode" type="checkbox">
                        <span class="toggle-track" aria-hidden="true"></span>
                        <span>Mit der Maus freirubbeln</span>
                    </label>
                    <p id="mode-hint" class="hint">Klicke auf ein Feld, um es aufzudecken.</p>

                    <h2>Spielregeln</h2>
                    <div id="ticket-rules" class="rules"></div>

                    <button id="reveal-all" class="btn btn-ghost" type="button">Alle aufdecken</button>
                    <button id="buy-again" class="btn btn-primary" type="button">Nochmals kaufen</button>
                    <p id="result" class="message result" role="status"></p>
                </aside>
            </div>
        </section>
    </main>

    <footer>
        <p class="footer-text">Casino Royal · Nur virtuelles Spielgeld · ab 18</p>
    </footer>
</body>
</html>
